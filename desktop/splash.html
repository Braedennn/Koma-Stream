<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Koma</title>
<style>
  /* The splash is the first thing you see, so it wears the same palette as the
     app: black ground, the app's own mark, one soft amber glow on the bar. */
  html, body { height: 100%; margin: 0; }
  body { -webkit-app-region: drag; display: grid; place-items: center;
    background: radial-gradient(900px 520px at 50% 38%, rgba(248, 248, 248, .06), transparent 62%), #000;
    color: #F8F8F8; font: 500 14px/1.5 Inter, "Segoe UI", system-ui, sans-serif; user-select: none; }
  main { display: grid; justify-items: center; gap: 18px; text-align: center; padding: 24px; }
  .mark { width: 74px; height: 74px; border-radius: 22px; display: grid; place-items: center;
    background: #F8F8F8; color: #242424; box-shadow: 0 20px 44px -20px rgba(248, 248, 248, .38);
    animation: breathe 2.4s cubic-bezier(.4, 0, 1, 1) infinite; }
  .mark svg { width: 32px; height: 32px; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
  p { margin: 0; max-width: 46ch; color: #9E9E9E; min-height: 21px; }
  .bar { width: 180px; height: 3px; border-radius: 999px; background: rgba(248, 248, 248, .1); overflow: hidden; }
  .bar i { display: block; width: 38%; height: 100%; border-radius: 999px; background: #F8F8F8;
    box-shadow: 0 0 12px -3px rgba(253, 183, 112, .9); animation: slide 1.4s cubic-bezier(.4, 0, .2, 1) infinite; }
  @keyframes breathe { 50% { transform: scale(1.03); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(268%); } }
  @media (prefers-reduced-motion: reduce) { .mark, .bar i { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.4 4.8v14.4a1 1 0 0 0 1.5.86l11.5-7.2a1 1 0 0 0 0-1.72L6.9 3.94A1 1 0 0 0 5.4 4.8z" fill="currentColor"/></svg></div>
  <h1>Koma</h1>
  <div class="bar"><i></i></div>
  <p id="status">Getting things ready…</p>
</main>
<script>
  // Android TV shares this exact splash; desktop and phone keep the Koma name.
  let television = false;
  try { television = !!window.KomaAndroid?.isTv?.(); } catch { /* no Android bridge */ }
  if (television) {
    document.title = 'Koma TV';
    document.querySelector('h1').textContent = 'Koma TV';
  }
  window.setStatus = text => { document.getElementById('status').textContent = text; };
</script>
</body>
</html>
