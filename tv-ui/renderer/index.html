<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koma TV</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' http://127.0.0.1:* http://localhost:*; media-src 'self' http://127.0.0.1:* http://localhost:* blob:">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tv.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-art" data-art="a"></div>
    <div class="backdrop-art" data-art="b"></div>
    <div class="backdrop-scrim"></div>
    <div class="backdrop-vignette"></div>
  </div>

  <header class="rail" id="rail">
    <button class="who" data-nav="home" aria-label="Koma home">
      <span class="who-mark">K</span>
    </button>
    <nav class="nav" aria-label="Sections">
      <button class="nav-item" data-nav="search" aria-label="Search">
        <svg viewBox="0 0 24 24" class="i"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5 21 21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Search
      </button>
      <button class="nav-item is-on" data-nav="home" aria-label="Home">
        <svg viewBox="0 0 24 24" class="i"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        Home
      </button>
      <button class="nav-item" data-nav="browse" aria-label="Browse">
        <svg viewBox="0 0 24 24" class="i"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-11Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 9.5h7M8.5 13h7M8.5 16.5h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Browse
      </button>
      <button class="nav-item" data-nav="library" aria-label="Library">
        <svg viewBox="0 0 24 24" class="i"><path d="M5 4.5h4v15H5zM10.5 4.5h4v15h-4zM16 5.2l3.4.6-2.6 12.4-3.2-.6L16 5.2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Library
      </button>
      <button class="nav-item" data-nav="tv" aria-label="Schedule">
        <svg viewBox="0 0 24 24" class="i"><rect x="3" y="5.5" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 9.5v5l4-2.5-4-2.5Z" fill="currentColor"/></svg>
        TV
      </button>
    </nav>
    <div class="rail-end">
      <span class="status" id="status" aria-label="Data source"><i class="dot"></i></span>
      <span class="clock" id="clock">--:--</span>
      <button class="icon-btn" data-nav="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M5.8 5.8l1.6 1.6M16.6 16.6l1.6 1.6M18.2 5.8l-1.6 1.6M7.4 16.6l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <footer class="foot">
    <span class="wordmark">KOMA</span>
    <span class="foot-note" id="foot-note"></span>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script src="js/lib/hls.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
